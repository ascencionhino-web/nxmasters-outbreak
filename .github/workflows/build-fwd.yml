name: Build Forwarder

# Compila el lanzador pequeno de un juego (ramas fwd/**). Tarda ~2 minutos.
on:
  push:
    branches: ['fwd/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias
        run: |
          for i in 1 2 3 4 5; do
            dkp-pacman -S --noconfirm --needed switch-tools libnx && break
            sleep 20
            dkp-pacman -Sy || true
          done

      - name: Compilar
        working-directory: fwd
        run: |
          export DEVKITPRO=/opt/devkitpro
          TITLE="$(grep '^TITLE=' app.cfg | cut -d= -f2-)"
          AUTHOR="$(grep '^AUTHOR=' app.cfg | cut -d= -f2-)"
          /opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc -O2 -g -march=armv8-a+crc+crypto -mtp=soft -fPIE \
            -specs=$DEVKITPRO/libnx/switch.specs -D__SWITCH__ -I$DEVKITPRO/libnx/include \
            main.c -L$DEVKITPRO/libnx/lib -lnx -o fwd.elf
          /opt/devkitpro/tools/bin/nacptool --create "$TITLE" "$AUTHOR" 1.0.0 fwd.nacp
          /opt/devkitpro/tools/bin/elf2nro fwd.elf NetherSX2.nro --icon=icon.jpg --nacp=fwd.nacp
          ls -la NetherSX2.nro

      - name: Nombre del artefacto
        id: slug
        run: echo "v=$(echo "$GITHUB_REF_NAME" | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Subir .nro
        uses: actions/upload-artifact@v4
        with:
          name: nro-${{ steps.slug.outputs.v }}
          path: fwd/NetherSX2.nro
